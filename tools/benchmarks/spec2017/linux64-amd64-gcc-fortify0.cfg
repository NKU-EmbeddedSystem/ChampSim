#------------------------------------------------------------------------------
# SPEC CPU2017 config file — modern gcc + no-pie for profiling pipeline
#------------------------------------------------------------------------------

%define label mytest
%ifndef %{bits}
%   define  bits        64
%endif
%ifndef %{build_ncpus}
%   define  build_ncpus 8
%endif

%define    os           LINUX
%if %{bits} == 64
%   define model        -m64
%elif %{bits} == 32
%   define model        -m32
%else
%   error Please define number of bits - see instructions in config file
%endif

command_add_redirect = 1
flagsurl             = $[top]/config/flags/gcc.xml
ignore_errors        = 1
iterations           = 1
label                = %{label}-m%{bits}
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=%{build_ncpus}
mean_anyway          = 1
output_format        = txt,html,cfg,pdf,csv
preenv               = 1
reportable           = 0
tune                 = base

intrate,fprate:
   copies           = 1
intspeed,fpspeed:
   threads          = 1

default:
%   define  gcc_dir        /usr
   preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
   SPECLANG                = %{gcc_dir}/bin/
   CC                      = $(SPECLANG)gcc     -std=c99   %{model}
   CXX                     = $(SPECLANG)g++     -std=c++03 %{model}
   FC                      = $(SPECLANG)gfortran           %{model}
   CC_VERSION_OPTION       = -v
   CXX_VERSION_OPTION      = -v
   FC_VERSION_OPTION       = -v

default:
%if %{bits} == 64
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit
%else
   sw_base_ptrsize = 32-bit
   sw_peak_ptrsize = 32-bit
%endif

#--------- Portability --------------------------------------------------------
default:
%if %{bits} == 32
    EXTRA_PORTABILITY = -D_FILE_OFFSET_BITS=64
%else
    EXTRA_PORTABILITY = -DSPEC_LP64
%endif

500.perlbench_r,600.perlbench_s:
%if %{bits} == 32
%   define suffix IA32
%else
%   define suffix X64
%endif
   PORTABILITY    = -DSPEC_%{os}_%{suffix}

521.wrf_r,621.wrf_s:
   CPORTABILITY  = -DSPEC_CASE_FLAG
   FPORTABILITY  = -fconvert=big-endian -fallow-argument-mismatch

523.xalancbmk_r,623.xalancbmk_s:
   PORTABILITY   = -DSPEC_%{os}

526.blender_r:
   PORTABILITY   = -funsigned-char -DSPEC_LINUX

527.cam4_r,627.cam4_s:
   PORTABILITY   = -DSPEC_CASE_FLAG -fallow-argument-mismatch

628.pop2_s:
   CPORTABILITY    = -DSPEC_CASE_FLAG
   FPORTABILITY    = -fconvert=big-endian -fallow-argument-mismatch

#-------- Tuning Flags common to Base and Peak --------------------------------
%if %{bits} == 32
   intspeed,fpspeed:
      fail_build = 1
%else
   intspeed,fpspeed:
      EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP
   fpspeed:
      preENV_OMP_STACKSIZE = 120M
%endif

#--------  Baseline Tuning Flags ----------------------------------------------
# Added -no-pie for fixed PC addresses matching objdump.
# Added -fcommon -fgnu89-inline for gcc 8+ / glibc 2.31+ compatibility.
# Added -D_FORTIFY_SOURCE=0 to disable fortify checks that conflict with PIN.

default=base:
   OPTIMIZE       = -g -O2 -march=native -fno-unsafe-math-optimizations -no-pie -fcommon -fgnu89-inline

intrate,intspeed=base:
   EXTRA_COPTIMIZE = -fno-strict-aliasing -D_FORTIFY_SOURCE=0 -U_FORTIFY_SOURCE

#-------------------------------------------------------------------------------
# Minimally filled tester/system descriptions
#-------------------------------------------------------------------------------

default:
   hw_avail           = Nov-2099
   sw_avail           = Nov-2099
   hw_cpu_nominal_mhz = 9999
   hw_cpu_max_mhz     = 9999
   hw_model           = profiling-pipeline
   hw_ncores          = 9999
   hw_ncpuorder       = 1 chips
   hw_nthreadspercore = 1
   hw_pcache          = 99 KB I + 99 KB D on chip per core
   hw_scache          = 99 KB I+D on chip per core
   hw_tcache          = 9 MB I+D on chip per chip
   hw_ocache          = None
   fw_bios            = N/A
   sw_other           = None

